<!DOCTYPE html>
<html>
<head>
<title>Student Admission Form</title>
<style>
body {
    font-family: Arial;
    background: #eaf1f8;
}
.container {
    width: 80%;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
}
h1, p {
    text-align: center;
}
h1 { color: #123c69; }
input, select, textarea {
    width: 95%;
    padding: 10px;
    margin: 8px;
}
button {
    width: 100%;
    padding: 12px;
    background: #123c69;
    color: white;
    border: none;
}
#msg {
    text-align: center;
    color: green;
}
</style>
</head>
<body>

<div class="container">
<h1>Student Admission Form</h1>
<p>Enter your details to apply for admission.</p>

<form id="f">
<label>Full Name</label>
<input type="text" required>

<label>Email</label>
<input type="email" required>

<label>Phone Number</label>
<input type="tel" pattern="[0-9]{10}" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>
<select required>
<option value="">Select Gender</option>
<option>Female</option>
<option>Male</option>
<option>Other</option>
</select>

<label>Course</label>
<select required>
<option value="">Select Course</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>BBA</option>
</select>

<label>Address</label>
<textarea required></textarea>

<button type="submit">Submit Application</button>
</form>

<p id="msg"></p>
</div>

<script>
document.getElementById("f").onsubmit = function(e) {
    e.preventDefault();
    document.getElementById("msg").innerHTML =
    "Admission form submitted successfully!";
    this.reset();
};
</script>

</body>
</html>
